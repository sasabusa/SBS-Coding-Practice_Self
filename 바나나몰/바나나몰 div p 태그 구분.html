<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>


    <!-- 안좋은 예(현재) -->
    <div class="desc" style="padding-top:20px">
        <b>성인용품</b>은 성생활을 더욱 매끄럽고 윤택하게 만들어주는 도구이자
        새로운 쾌감에 눈을 뜨게 해주는 선생님과도 같은 존재입니다.
    </div>

    <!-- 좋은 예 -->
    <div class="desc" style="padding-top:20px">
        <p>
            <strong>성인용품</strong>은 성생활을 더욱 매끄럽고 윤택하게 만들어주는 도구이자
            새로운 쾌감에 눈을 뜨게 해주는 선생님과도 같은 존재입니다.
        </p>
    </div>

    <!-- 좋은 예 -->
    <div class="desc" style="padding-top:20px">
        <p>
            <span style="font-weight: bold;">성인용품</span>은 성생활을 더욱 매끄럽고 윤택하게 만들어주는 도구이자
            새로운 쾌감에 눈을 뜨게 해주는 선생님과도 같은 존재입니다.
        </p>
    </div>

    
</body>
